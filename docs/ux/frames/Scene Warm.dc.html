<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<![CDATA[<div style="position:absolute;inset:0;overflow:hidden;background:#05070f">
  <div style="{{ skyStyle }}"></div>
  <div style="{{ moonStyle }}"></div>
  <sc-for list="{{ stars }}" as="s" hint-placeholder-count="0"><div style="{{ s.style }}"></div></sc-for>
  <div style="{{ glowStyle }}"></div>
  <div style="{{ cloudAStyle }}"></div>
  <div style="{{ cloudBStyle }}"></div>
  <div style="{{ cloudCStyle }}"></div>
  <div style="{{ hillFarStyle }}"></div>
  <div style="{{ hillMidStyle }}"></div>
  <div style="{{ treelineStyle }}"></div>
  <div style="{{ landStyle }}"></div>
  <div style="{{ vergeStyle }}"></div>
  <div style="{{ pathStyle }}"></div>
  <div style="{{ pathCoreStyle }}"></div>
  <sc-for list="{{ stones }}" as="m" hint-placeholder-count="0"><div style="{{ m.style }}"></div></sc-for>
  <div style="{{ poolStyle }}"></div>
  <div style="{{ houseWrapStyle }}">
    <div style="{{ chimneyStyle }}"></div>
    <div style="{{ roofStyle }}"></div>
    <div style="{{ bodyStyle }}">
      <div style="{{ winLStyle }}"></div>
      <div style="{{ winRStyle }}"></div>
      <div style="{{ doorStyle }}"></div>
    </div>
  </div>
  <sc-for list="{{ lanterns }}" as="l" hint-placeholder-count="0">
    <div style="{{ l.post }}"></div>
    <div style="{{ l.lamp }}"></div>
  </sc-for>
  <sc-for list="{{ flies }}" as="f" hint-placeholder-count="0"><div style="{{ f.style }}"></div></sc-for>
  <div style="{{ rainStyle }}"></div>
  <div style="{{ grainStyle }}"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(125% 72% at 50% 76%, rgba(0,0,0,0) 42%, rgba(0,0,0,.4) 100%);pointer-events:none"></div>
</div>]]>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:852},&quot;b&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.2,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;},&quot;d&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.35,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;},&quot;h&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:852,&quot;tsType&quot;:&quot;number&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hearth&quot;,&quot;valley&quot;],&quot;default&quot;:&quot;hearth&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const num = (v, dd) => { const n = parseFloat(v); return isNaN(n) ? dd : n; };
    const b = Math.max(0, Math.min(1, num(this.props.b, 0.2)));
    const d = Math.max(0, Math.min(1, num(this.props.d, 0.1)));
    const w = Math.max(0, Math.min(1, num(this.props.w, 0)));
    const H = num(this.props.h, 852), k = H / 852;
    const valley = (this.props.variant || 'hearth') === 'valley';
    const horizon = H * (valley ? 0.47 : 0.44);

    const hx = (h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
    const mix = (a, c, t) => { const A = hx(a), C = hx(c);
      return `rgb(${Math.round(A[0]+(C[0]-A[0])*t)},${Math.round(A[1]+(C[1]-A[1])*t)},${Math.round(A[2]+(C[2]-A[2])*t)})`; };

    const top = mix('#080B1C', '#8FB6DA', b);
    const mid = mix('#141C38', '#C4D8E8', b);
    const low = mix('#2A2438', '#F6D9AB', b);
    const skyStyle = `position:absolute;left:0;right:0;top:0;height:${horizon + 2}px;background:linear-gradient(180deg, ${top} 0%, ${mid} 52%, ${low} 100%)`;

    const mS = 30 * k, mOp = Math.max(0, 0.9 - b * 1.1);
    const moonStyle = `position:absolute;left:20%;top:${H * 0.1}px;width:${mS}px;height:${mS}px;border-radius:50%;background:#F6EBD2;box-shadow:0 0 ${mS * 2.4}px ${mS * 0.7}px rgba(246,235,210,.28);opacity:${mOp.toFixed(2)}`;

    const starOp = Math.max(0, 0.9 - b * 1.15);
    const pts = [[8,7,1.4],[19,14,1],[27,5,1.2],[36,20,1],[44,9,1.6],[52,17,1],[61,6,1.2],[69,15,1.4],[77,10,1],[86,19,1.2],[93,8,1.4],[13,25,1],[31,30,1.2],[57,27,1],[72,31,1.2],[88,28,1],[4,17,1],[48,33,1],[65,23,1.4],[81,34,1]];
    const stars = pts.map((p, i) => ({ key: i, style: `position:absolute;left:${p[0]}%;top:${p[1]}%;width:${p[2]}px;height:${p[2]}px;border-radius:50%;background:#FFF6E2;opacity:${(starOp * (0.45 + (i % 4) * 0.18)).toFixed(2)}` }));

    const glowH = (80 + 260 * b) * k;
    const glowStyle = `position:absolute;left:-14%;right:-14%;top:${horizon - glowH}px;height:${glowH}px;background:radial-gradient(100% 100% at 50% 100%, ${mix('#E8A867','#FFECCB',b)} 0%, rgba(0,0,0,0) 70%);opacity:${(0.2 + 0.68 * b).toFixed(2)}`;

    const cl = (l, t, wd, ht, o, bl) => `position:absolute;left:${l}%;top:${t}px;width:${wd * k}px;height:${ht * k}px;border-radius:50%;background:${mix('#767F98','#A6AFC0',b)};filter:blur(${bl}px);opacity:${(o * w).toFixed(2)}`;
    const cloudAStyle = cl(-10, horizon - 240 * k, 260, 64, 0.72, 15);
    const cloudBStyle = cl(40, horizon - 196 * k, 220, 50, 0.6, 13);
    const cloudCStyle = cl(12, horizon - 292 * k, 180, 42, 0.45, 17);

    const hillFar = mix('#0E1526', '#7E8C79', b), hillMid = mix('#0A101E', '#5F6C55', b);
    const hillFarStyle = valley
      ? `position:absolute;left:-30%;width:90%;height:${170 * k}px;top:${horizon - 120 * k}px;border-radius:50% 50% 0 0;background:${hillFar}`
      : `position:absolute;left:-24%;width:70%;height:${86 * k}px;top:${horizon - 52 * k}px;border-radius:50% 50% 0 0;background:${hillFar};opacity:.9`;
    const hillMidStyle = valley
      ? `position:absolute;right:-34%;width:96%;height:${196 * k}px;top:${horizon - 138 * k}px;border-radius:50% 50% 0 0;background:${hillMid}`
      : `position:absolute;right:-26%;width:74%;height:${74 * k}px;top:${horizon - 44 * k}px;border-radius:50% 50% 0 0;background:${hillMid};opacity:.9`;

    let poly = '0% 100%';
    for (let i = 0; i <= 26; i++) { const x = (i / 26) * 100; const y = i % 2 ? 4 + (i % 5) * 13 : 46 + (i % 3) * 12; poly += `, ${x.toFixed(1)}% ${y}%`; }
    poly += ', 100% 100%';
    const treelineStyle = `position:absolute;left:0;right:0;top:${horizon - 30 * k}px;height:${32 * k}px;clip-path:polygon(${poly});background:${mix('#070C16','#39432F',b)};opacity:${valley ? 0.55 : 1}`;

    const landStyle = `position:absolute;left:0;right:0;top:${horizon}px;bottom:0;background:linear-gradient(180deg, ${mix('#0D1420','#4E5A45',b)} 0%, ${mix('#060A11','#2E3626',b)} 100%)`;
    const vergeStyle = `position:absolute;left:0;right:0;top:${horizon}px;bottom:0;background:repeating-linear-gradient(96deg, rgba(255,255,255,.05) 0 1.5px, rgba(0,0,0,0) 1.5px 9px);opacity:${(0.35 + 0.3 * b).toFixed(2)}`;

    const pathStyle = `position:absolute;left:0;right:0;top:${horizon}px;bottom:0;clip-path:polygon(47.4% 0, 52.6% 0, 84% 100%, 16% 100%);background:linear-gradient(180deg, ${mix('#242C3E','#D6C09A',b)} 0%, ${mix('#3B4459','#EADCBE',b)} 100%);opacity:.55;filter:blur(6px)`;
    const pathCoreStyle = `position:absolute;left:0;right:0;top:${horizon}px;bottom:0;clip-path:polygon(48.3% 0, 51.7% 0, 78% 100%, 22% 100%);background:linear-gradient(180deg, ${mix('#1A2130','#D9C49E',b)} 0%, ${mix('#2C3446','#EFE2C6',b)} 100%);opacity:.88`;

    const stones = [0.12, 0.26, 0.42, 0.62, 0.84].map((t, i) => {
      const y = horizon + (H - horizon) * t, sw = (7 + 34 * t) * k;
      return { key: i, style: `position:absolute;left:${50 + (i % 2 ? 3.5 : -3.5) * t}%;top:${y}px;width:${sw}px;height:${sw * 0.32}px;margin-left:${-sw / 2}px;border-radius:50%;background:${mix('#161D2B','#B8A47E',b)};opacity:.5` };
    });

    const hw = (26 + 150 * Math.pow(d, 1.15)) * k;
    const hb = (H - horizon) * (1 - 0.6 * d) - 6 * k;
    const poolR = hw * 2.6;
    const poolStyle = `position:absolute;left:50%;bottom:${hb - poolR * 0.22}px;width:${poolR}px;height:${poolR * 0.5}px;margin-left:${-poolR / 2}px;border-radius:50%;background:radial-gradient(50% 50% at 50% 50%, rgba(255,198,120,${(0.5 - 0.2 * b).toFixed(2)}) 0%, rgba(255,198,120,0) 70%)`;
    const houseWrapStyle = `position:absolute;left:50%;bottom:${hb}px;width:${hw}px;margin-left:${-hw / 2}px`;
    const chimneyStyle = `position:absolute;right:${hw * 0.16}px;top:${-hw * 0.12}px;width:${hw * 0.11}px;height:${hw * 0.2}px;background:${mix('#101725','#4E4738',b)}`;
    const roofStyle = `width:100%;height:${hw * 0.4}px;clip-path:polygon(50% 0,100% 100%,0 100%);background:${mix('#131A28','#4A4335',b)}`;
    const bodyStyle = `width:${hw * 0.74}px;margin:0 auto;height:${hw * 0.56}px;background:${mix('#0E141F','#5E5747',b)};position:relative`;
    const winS = Math.max(2.5, hw * 0.17);
    const winL = `position:absolute;left:${hw * 0.09}px;top:${hw * 0.12}px;width:${winS}px;height:${winS}px;background:#FFCE86;box-shadow:0 0 ${winS * 2}px ${winS * 0.6}px rgba(255,198,110,.55)`;
    const winR = `position:absolute;right:${hw * 0.09}px;top:${hw * 0.12}px;width:${winS}px;height:${winS}px;background:#FFD79A;box-shadow:0 0 ${winS * 2}px ${winS * 0.6}px rgba(255,198,110,.5)`;
    const doorStyle = `position:absolute;left:50%;bottom:0;width:${winS * 0.8}px;height:${winS * 1.3}px;margin-left:${-winS * 0.4}px;border-radius:${winS * 0.4}px ${winS * 0.4}px 0 0;background:#FFC178;box-shadow:0 0 ${winS * 2.2}px ${winS * 0.7}px rgba(255,180,100,.45)`;

    const lanterns = [[0.3, 42.5], [0.55, 60], [0.8, 33]].map((L, i) => {
      const y = horizon + (H - horizon) * L[0], ph = (16 + 40 * L[0]) * k, ls = (3 + 6 * L[0]) * k;
      return { key: i,
        post: `position:absolute;left:${L[1]}%;top:${y}px;width:${Math.max(1, 2 * k * (0.5 + L[0]))}px;height:${ph}px;background:${mix('#0B111C','#463F31',b)};opacity:.85`,
        lamp: `position:absolute;left:${L[1]}%;top:${y - ls * 0.6}px;width:${ls}px;height:${ls}px;margin-left:${-ls * 0.4}px;border-radius:50%;background:#FFCE86;box-shadow:0 0 ${ls * 3}px ${ls}px rgba(255,190,110,${(0.5 - 0.25 * b).toFixed(2)})` };
    });

    const flies = [[30, 0.62], [38, 0.74], [64, 0.68], [71, 0.86], [46, 0.9]].map((f, i) => ({ key: i,
      style: `position:absolute;left:${f[0]}%;top:${horizon + (H - horizon) * f[1]}px;width:${2.5 * k}px;height:${2.5 * k}px;border-radius:50%;background:#FFD79A;box-shadow:0 0 ${8 * k}px ${2 * k}px rgba(255,200,120,.5);opacity:${(0.75 - 0.5 * b).toFixed(2)}` }));

    const rainStyle = `position:absolute;inset:0;background:repeating-linear-gradient(74deg, rgba(0,0,0,0) 0 7px, ${b > 0.55 ? 'rgba(60,70,90,.3)' : 'rgba(206,216,235,.26)'} 7px 8px);opacity:${(w > 0.45 ? (w - 0.45) * 1.6 : 0).toFixed(2)};pointer-events:none`;
    const grainStyle = `position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, rgba(0,0,0,.022) 1px 2px);pointer-events:none`;

    return { skyStyle, moonStyle, stars, glowStyle, cloudAStyle, cloudBStyle, cloudCStyle, hillFarStyle, hillMidStyle, treelineStyle, landStyle, vergeStyle, pathStyle, pathCoreStyle, stones, poolStyle, houseWrapStyle, chimneyStyle, roofStyle, bodyStyle, winLStyle: winL, winRStyle: winR, doorStyle, lanterns, flies, rainStyle, grainStyle };
  }
}
</script>
</body>
</html>
