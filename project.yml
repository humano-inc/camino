name: Camino
options:
  bundleIdPrefix: app.camino
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: "1.0"
    INFOPLIST_KEY_CFBundleDisplayName: Camino
    INFOPLIST_KEY_LSRequiresIPhoneOS: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: D4ADFZ3XZL
    CODE_SIGN_STYLE: Automatic
targets:
  Camino:
    type: application
    platform: iOS
    sources:
      - path: Camino
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.camino.personal
        PRODUCT_NAME: Camino
        INFOPLIST_FILE: Camino/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: D4ADFZ3XZL
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Camino/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
  CaminoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaminoTests
    dependencies:
      - target: Camino
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.camino.personal.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Camino.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Camino"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEVELOPMENT_TEAM: D4ADFZ3XZL
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Camino:
    build:
      targets:
        Camino: all
        CaminoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CaminoTests
